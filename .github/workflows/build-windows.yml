
name: Build Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone EXE
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name SHP_DXF_Converter --collect-all pyproj --collect-all shapely shp_dxf_converter.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: SHP_DXF_Converter-Windows11
          path: dist/SHP_DXF_Converter.exe
          if-no-files-found: error
          retention-days: 30
